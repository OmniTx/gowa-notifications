name: PHP Coding Standards

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/phpcs.yml'
      - 'phpcs.xml.dist'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/phpcs.yml'
      - 'phpcs.xml.dist'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: PHP Coding Standards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: cs2pr

      - name: Install PHPCS and WordPress Coding Standards
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev --no-interaction --quiet \
            dealerdirect/phpcodesniffer-composer-installer \
            wp-coding-standards/wpcs \
            phpcompatibility/phpcompatibility-wp
          echo "$(composer config -g home)/vendor/bin" >> $GITHUB_PATH

      - name: Run PHPCS Scan
        run: phpcs -q --report=checkstyle --runtime-set ignore_warnings_on_exit 1 | cs2pr