name: Build & Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag Annotation / Release Notes
        id: tag_notes
        run: |
          NOTES=$(git tag -l --format='%(contents)' ${{ github.ref_name }})
          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ github.ref_name }}"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Package GitHub Release (Includes Updater)
        run: |
          mkdir -p build/gowa-notifications
          rsync -av --progress ./ build/gowa-notifications/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.vscode' \
            --exclude 'build' \
            --exclude '.gitignore' \
            --exclude '*.zip'
          
          cd build
          zip -r ../gowa-notifications.zip gowa-notifications/
          cd ..
          ls -lh gowa-notifications.zip

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: gowa-notifications.zip
          body: ${{ steps.tag_notes.outputs.notes }}
          draft: false
          prerelease: false