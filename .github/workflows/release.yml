name: Build & Release (GitHub Only)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag Release Notes
        id: tag_notes
        run: |
          NOTES=$(git tag -l --format='%(contents)' ${{ github.ref_name }})
          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ github.ref_name }}"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Package GitHub Release Archive
        run: |
          mkdir -p build/notify-with-gowa
          rsync -av --progress ./ build/notify-with-gowa/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.vscode' \
            --exclude 'build' \
            --exclude '.gitignore' \
            --exclude '.distignore' \
            --exclude '*.zip'
          
          cd build
          zip -r ../notify-with-gowa.zip notify-with-gowa/
          cd ..
          ls -lh notify-with-gowa.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: notify-with-gowa.zip
          body: ${{ steps.tag_notes.outputs.notes }}
          draft: false
          prerelease: false